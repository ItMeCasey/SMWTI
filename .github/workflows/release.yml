name: Build and publish

# Builds every loader and Minecraft version, runs the unit tests and uploads the jars.
# Builds run on every push to a tag like v2026.11.1 and on manual runs. Uploads happen only
# for tag pushes and for manual runs with publish set to true.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the jars to CurseForge (and to Modrinth when UPLOAD_TO_MODRINTH is true)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge 1.20.1
            dir: versions/mc1.20.1/forge
            java: '17'
            mc: '1.20.1'
            loader: forge
            cf_game_versions: '9990,7498,9638,9639'
          - name: NeoForge 1.20.1
            dir: versions/mc1.20.1/neoforge
            java: '17'
            mc: '1.20.1'
            loader: neoforge
            cf_game_versions: '9990,10150,9638,9639'
          - name: Forge 1.21.1
            dir: versions/mc1.21.1/forge
            java: '21'
            mc: '1.21.1'
            loader: forge
            cf_game_versions: '11779,7498,9638,9639'
          - name: NeoForge 1.21.1
            dir: versions/mc1.21.1/neoforge
            java: '21'
            mc: '1.21.1'
            loader: neoforge
            cf_game_versions: '11779,10150,9638,9639'
          - name: Forge 26.1.2
            dir: versions/mc26.1.2/forge
            java: '25'
            mc: '26.1.2'
            loader: forge
            cf_game_versions: '16082,7498,9638,9639'
          - name: NeoForge 26.1.2
            dir: versions/mc26.1.2/neoforge
            java: '25'
            mc: '26.1.2'
            loader: neoforge
            cf_game_versions: '16082,10150,9638,9639'
          - name: Forge 26.2
            dir: versions/mc26.2/forge
            java: '25'
            mc: '26.2'
            loader: forge
            cf_game_versions: '16498,7498,9638,9639'
          - name: NeoForge 26.2
            dir: versions/mc26.2/neoforge
            java: '25'
            mc: '26.2'
            loader: neoforge
            cf_game_versions: '16498,10150,9638,9639'
          - name: Forge 26.3
            dir: versions/mc26.3/forge
            java: '25'
            mc: '26.3'
            loader: forge
            cf_game_versions: '17045,7498,9638,9639'
          - name: NeoForge 26.3
            dir: versions/mc26.3/neoforge
            java: '25'
            mc: '26.3'
            loader: neoforge
            cf_game_versions: '17045,10150,9638,9639'
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      # A tag push (and a manual run with publish set) releases only the builds whose own mod_version
      # is the release version, so unchanged builds are neither rebuilt nor uploaded again. The release
      # version is the tag without the v, or the newest CHANGELOG heading for a manual run. Pushes of
      # other refs and dry runs without publish build everything.
      - name: Decide whether this build is part of the release
        id: gate
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          release=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release="${GITHUB_REF_NAME#v}"
          elif [ "${{ inputs.publish }}" == "true" ]; then
            release=$(grep -m1 '^## ' "$GITHUB_WORKSPACE/CHANGELOG.md" | sed 's/^## //')
          fi
          if [ -n "$release" ] && [ "$version" != "$release" ]; then
            echo "skipping ${{ matrix.name }}: version $version is not v$release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build and test
        if: steps.gate.outputs.skip != 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - name: Find the jar
        id: jar
        if: steps.gate.outputs.skip != 'true'
        run: |
          jar=$(ls build/libs/smwti-${{ matrix.loader }}-${{ matrix.mc }}-*.jar | grep -v -- '-api' | head -1)
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar")" >> "$GITHUB_OUTPUT"
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ matrix.dir }}/${{ steps.jar.outputs.path }}

      - name: Changelog for this version
        id: changelog
        if: steps.gate.outputs.skip != 'true' && (github.event_name == 'push' || inputs.publish)
        run: |
          notes=$(awk -v v="${{ steps.jar.outputs.version }}" '
            $0 ~ "^## " v { on=1; next }
            on && /^## / { exit }
            on { print }' "$GITHUB_WORKSPACE/CHANGELOG.md" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$notes" ]; then notes="SMWTI ${{ steps.jar.outputs.version }}."; fi
          { echo "text<<EOF"; echo "$notes"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Upload to CurseForge
        if: steps.gate.outputs.skip != 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.text }}
        run: |
          meta=$(jq -n \
            --arg changelog "$CHANGELOG" \
            --arg name "SMWTI ${{ steps.jar.outputs.version }} for ${{ matrix.name }}" \
            --argjson gv "[${{ matrix.cf_game_versions }}]" \
            '{changelog: $changelog, changelogType: "text", displayName: $name, gameVersions: $gv, releaseType: "beta"}')
          echo "$meta" > "$RUNNER_TEMP/meta.json"
          ls -la "${{ steps.jar.outputs.path }}" "$RUNNER_TEMP/meta.json"
          curl -sS --fail-with-body -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            -F "metadata=<$RUNNER_TEMP/meta.json" \
            -F "file=@${{ steps.jar.outputs.path }}" \
            https://minecraft.curseforge.com/api/projects/1781438/upload-file

      # Modrinth is on hold: this step runs only when the repository variable UPLOAD_TO_MODRINTH is set to true.
      - name: Upload to Modrinth
        if: steps.gate.outputs.skip != 'true' && ((startsWith(github.ref, 'refs/tags/v') || inputs.publish) && vars.UPLOAD_TO_MODRINTH == 'true')
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.text }}
        run: |
          number="${{ steps.jar.outputs.version }}+${{ matrix.loader }}-${{ matrix.mc }}"
          data=$(jq -n \
            --arg number "$number" \
            --arg name "SMWTI ${{ steps.jar.outputs.version }} for ${{ matrix.name }}" \
            --arg file "${{ steps.jar.outputs.name }}" \
            --arg changelog "$CHANGELOG" \
            --arg mc "${{ matrix.mc }}" \
            --arg loader "${{ matrix.loader }}" \
            '{project_id: "CQb1zQ86", file_parts: [$file], version_number: $number, name: $name, version_type: "beta", loaders: [$loader], game_versions: [$mc], featured: false, dependencies: [], changelog: $changelog}')
          echo "$data" > "$RUNNER_TEMP/data.json"
          curl -sf -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: ItMeCasey/SMWTI" \
            -F "data=<$RUNNER_TEMP/data.json" \
            -F "${{ steps.jar.outputs.name }}=@${{ steps.jar.outputs.path }}" \
            https://api.modrinth.com/v2/version

  # A release tag must match at least one build, or nothing would be uploaded.
  verify:
    name: A build matches the release version
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that some build has the release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release="${GITHUB_REF_NAME#v}"
          else
            release=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //')
          fi
          found=0
          for f in versions/*/*/gradle.properties; do
            if [ "$(grep '^mod_version=' "$f" | cut -d= -f2)" == "$release" ]; then found=$((found+1)); fi
          done
          echo "$found build(s) have version $release"
          if [ "$found" -eq 0 ]; then
            echo "No build has mod_version $release, so there is nothing to release"
            exit 1
          fi
