name: Build

# Builds and tests every loader and Minecraft version on each push and pull request, and keeps the jars
# as artifacts. Releases are made by release.yml on a tag.
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge 1.20.1
            dir: versions/mc1.20.1/forge
            java: '17'
            mc: '1.20.1'
            loader: forge
          - name: NeoForge 1.20.1
            dir: versions/mc1.20.1/neoforge
            java: '17'
            mc: '1.20.1'
            loader: neoforge
          - name: Forge 1.21.1
            dir: versions/mc1.21.1/forge
            java: '21'
            mc: '1.21.1'
            loader: forge
          - name: NeoForge 1.21.1
            dir: versions/mc1.21.1/neoforge
            java: '21'
            mc: '1.21.1'
            loader: neoforge
          - name: Forge 26.1.2
            dir: versions/mc26.1.2/forge
            java: '25'
            mc: '26.1.2'
            loader: forge
          - name: NeoForge 26.1.2
            dir: versions/mc26.1.2/neoforge
            java: '25'
            mc: '26.1.2'
            loader: neoforge
          - name: Forge 26.2
            dir: versions/mc26.2/forge
            java: '25'
            mc: '26.2'
            loader: forge
          - name: NeoForge 26.2
            dir: versions/mc26.2/neoforge
            java: '25'
            mc: '26.2'
            loader: neoforge
          - name: Forge 26.3
            dir: versions/mc26.3/forge
            java: '25'
            mc: '26.3'
            loader: forge
          - name: NeoForge 26.3
            dir: versions/mc26.3/neoforge
            java: '25'
            mc: '26.3'
            loader: neoforge
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: smwti-${{ matrix.loader }}-${{ matrix.mc }}
          path: ${{ matrix.dir }}/build/libs/*.jar
