name: Build

# Builds and tests only the loader and Minecraft versions whose files changed in the push or pull request, and
# keeps the jars as artifacts. Docs, status and workflow changes build nothing (see .github/scripts/plan_matrix.py).
# Releases are made by release.yml on a tag.
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    name: Pick the builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 -I .github/scripts/plan_matrix.py build --before "$PR_BASE" --sha "$PR_HEAD"
          else
            python3 -I .github/scripts/plan_matrix.py build --before "$BEFORE" --sha "$SHA"
          fi

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: smwti-${{ matrix.loader }}-${{ matrix.mc }}
          path: ${{ matrix.dir }}/build/libs/*.jar
