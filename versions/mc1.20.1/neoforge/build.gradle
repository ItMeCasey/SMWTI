plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

version = mod_version

// Jar name: smwti-neoforge-<minecraft version>-<mod version>
base {
    archivesName = 'smwti-neoforge-1.20.1'
}
group = mod_group_id

// Mojang ships Java 17 to end users in 1.18+, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

runs {
    configureEach {
        workingDirectory = project.file('run')
        modSource sourceSets.main
    }

    client {
    }

    server {
        programArgument '--nogui'
    }
}

repositories {
    maven { url 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:forge:${minecraft_version}-${neo_version}"

    // Unit tests for the parts that do not need the game running.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The unit tests touch Minecraft's classes, so they compile and run on the game's classpath.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

test {
    useJUnitPlatform()
}

// mods.toml and pack.mcmeta are templates: this fills in their ${} values from gradle.properties
// (a missing one is an error) and adds the result to the jar's resources.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The public API on its own, for mods that support SMWTI to compile against. It holds only the
// com.itmecasey.smwti.api package, so a mod never sees SMWTI's internals.
tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include 'com/itmecasey/smwti/api/**'
    }
}
