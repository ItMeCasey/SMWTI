org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true

# Minecraft and Forge. The ranges go into META-INF/mods.toml.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
forge_version=52.1.20
forge_version_range=[52,)
# The Forge 1.21.1 MDK leaves the javafml range open.
loader_version_range=[0,)

# Mod properties. They fill in the templates under src/main/templates, so a release only
# changes mod_version here.
mod_id=smwti
mod_name=Show Me What This Is
mod_license=MIT
mod_version=2026.11.3
mod_group_id=com.itmecasey.smwti
mod_authors=ItMeCasey
mod_description=A look-at overlay: point at a block or an entity and see what it is, which mod it comes from and what state it is in. Other mods add their own lines through a small API.
